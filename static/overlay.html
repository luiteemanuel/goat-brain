<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Goat PTT</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { font-family: "Inter", system-ui, sans-serif; user-select: none; }
  .box {
    margin: 6px 12px; padding: 10px 16px; border-radius: 14px;
    background: rgba(15, 17, 21, 0.82);
    border: 1px solid rgba(79, 140, 255, 0.45);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; gap: 14px;
  }
  .wave { display: flex; align-items: center; gap: 3px; height: 34px; flex: 1; }
  .bar {
    width: 4px; min-height: 4px; border-radius: 2px;
    background: var(--accent, #4f8cff);
    animation: wave 0.9s ease-in-out infinite;
  }
  @keyframes wave { 0%, 100% { height: 4px; } 50% { height: 30px; } }
  .label { color: #e8eaf0; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
</style>
</head>
<body>
<div class="box">
  <span class="dot"></span>
  <div class="wave" id="wave"></div>
  <span class="label">Ouvindo… solte para transcrever</span>
</div>
<script>
  const wave = document.getElementById("wave");
  for (let i = 0; i < 18; i++) {
    const b = document.createElement("span");
    b.className = "bar";
    b.style.animationDelay = `-${(Math.random() * 1).toFixed(2)}s`;
    b.style.animationDuration = `${(0.6 + Math.random() * 0.8).toFixed(2)}s`;
    wave.appendChild(b);
  }
</script>
</body>
</html>
