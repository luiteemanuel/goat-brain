[package]
name = "goat-reuniao"
version = "0.1.0"
edition = "2021"

[lib]
name = "goat_reuniao_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["clock"] }
cpal = "0.18.1"
evdev = "0.13.2"
reqwest = { version = "0.13.4", features = ["blocking", "json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
webrtc-vad = "0.4.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }
